name: Publish apmw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Docs-only changes are checked by pages.yml.
    paths-ignore:
      - 'docs/**'
      - 'apps/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      python-version: ${{ steps.version.outputs.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - name: Build
        uses: GravionLabs/ci/python/build@main
        with:
          version: ${{ needs.determine-version.outputs.python-version }}

      - name: Test
        uses: GravionLabs/ci/python/test@main

  build-executables:
    name: Build executable (${{ matrix.suffix }})
    # macOS and Windows runners are expensive: executables are only built when a release branch is
    # merged into main (or on workflow_dispatch). Pull requests get build-test on Linux.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: determine-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
          - os: macos-latest
            suffix: macos-arm64
          - os: windows-latest
            suffix: windows.exe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (uv)
        uses: GravionLabs/ci/python/setup@main

      - name: Install dependencies
        run: uv sync

      - name: Build executable
        run: uv run --with pyinstaller pyinstaller --onefile --name apmw-${{ matrix.suffix }} scripts/apmw_entrypoint.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: apmw-${{ matrix.suffix }}
          path: dist/apmw-${{ matrix.suffix }}
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs:
      - determine-version
      - build-test
    steps:
      - name: Publish Python package
        uses: GravionLabs/ci/python/pypi/publish@main
        with:
          download-artifact: 'true'

  release:
    name: Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - determine-version
      - publish
      - build-executables
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          tag-prefix: v

      - name: Download executable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apmw-*
          path: executables
          merge-multiple: true

      - name: Attach executables to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.determine-version.outputs.semver }}"
          gh release upload "$TAG" executables/* --clobber
